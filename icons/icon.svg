<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1118"/>
      <stop offset="50%" stop-color="#141824"/>
      <stop offset="100%" stop-color="#080a0f"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="bullGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="bearGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="106" fill="none" stroke="rgba(56, 189, 248, 0.25)" stroke-width="4"/>

  <!-- Subtle Chart Grid Lines -->
  <line x1="80" y1="160" x2="432" y2="160" stroke="rgba(255,255,255,0.06)" stroke-width="2" stroke-dasharray="6,6"/>
  <line x1="80" y1="256" x2="432" y2="256" stroke="rgba(255,255,255,0.06)" stroke-width="2" stroke-dasharray="6,6"/>
  <line x1="80" y1="352" x2="432" y2="352" stroke="rgba(255,255,255,0.06)" stroke-width="2" stroke-dasharray="6,6"/>

  <!-- Candlestick 1 (Bull) -->
  <line x1="130" y1="220" x2="130" y2="360" stroke="#22c55e" stroke-width="5" stroke-linecap="round"/>
  <rect x="114" y="250" width="32" height="80" rx="6" fill="url(#bullGrad)"/>

  <!-- Candlestick 2 (Bear) -->
  <line x1="200" y1="180" x2="200" y2="330" stroke="#ef4444" stroke-width="5" stroke-linecap="round"/>
  <rect x="184" y="210" width="32" height="90" rx="6" fill="url(#bearGrad)"/>

  <!-- Candlestick 3 (Bull High) -->
  <line x1="270" y1="130" x2="270" y2="300" stroke="#22c55e" stroke-width="5" stroke-linecap="round"/>
  <rect x="254" y="160" width="32" height="110" rx="6" fill="url(#bullGrad)"/>

  <!-- Candlestick 4 (Breakout Bull) -->
  <line x1="340" y1="90" x2="340" y2="260" stroke="#38bdf8" stroke-width="5" stroke-linecap="round"/>
  <rect x="324" y="110" width="32" height="120" rx="6" fill="url(#glowGrad)"/>

  <!-- Dynamic Glowing Trend Curve -->
  <path d="M 80 340 Q 180 320, 240 230 T 432 100" fill="none" stroke="url(#glowGrad)" stroke-width="12" stroke-linecap="round" filter="url(#neonGlow)"/>

  <!-- Pulse Dot at Trend Tip -->
  <circle cx="432" cy="100" r="14" fill="#38bdf8" filter="url(#neonGlow)"/>
  <circle cx="432" cy="100" r="7" fill="#ffffff"/>

  <!-- Brand Label "TRADINGTOOLS" -->
  <rect x="116" y="396" width="280" height="44" rx="12" fill="rgba(19, 23, 34, 0.92)" stroke="rgba(56, 189, 248, 0.45)" stroke-width="2"/>
  <text x="256" y="425" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="18.5" text-anchor="middle" letter-spacing="2.8">TRADINGTOOLS</text>
</svg>
