# ==============================================================================
# NGINX Configuration for TradingTools Workstation
# Domain: trd.ssotansum.com
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name trd.ssotansum.com;

    # Auto Redirect HTTP to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name trd.ssotansum.com;

    # SSL Certificate (Certbot Let's Encrypt paths)
    ssl_certificate /etc/letsencrypt/live/trd.ssotansum.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/trd.ssotansum.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Performance & Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # GZIP Compression for Ultra-Fast Mobile & Tablet Loading
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml application/manifest+json;

    client_max_body_size 50M;

    # PWA Service Worker (Always Fresh)
    location /sw.js {
        proxy_pass http://127.0.0.1:3000/sw.js;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Service-Worker-Allowed "/";
    }

    # Static Assets Caching (7 Days)
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff2|svg)$ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # Realtime SSE Streaming (Zero-Buffering for Sub-Millisecond Ticks)
    location /api/live-stream {
        proxy_pass http://127.0.0.1:3000/api/live-stream;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        chunked_transfer_encoding off;
    }

    # Reverse Proxy to Python Backend
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # WebSocket & Long-polling support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
